# Максимальный размер кучи для Gradle-демона
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Параллельная сборка модулей
org.gradle.parallel=true

# Конфигурация по требованию (включает поддержку библиотек)
org.gradle.caching=true

# AndroidX вместо старого Support Library
android.useAndroidX=true

# Только нужные локали для appcompat
android.nonTransitiveRClass=true

# Kotlin-код в стиле Kotlin (вместо старого kapt-стиля)
kotlin.code.style=official
